[project]
name = "flask-base"
version = "0.1.0"
description = ""
authors = [
    {name = "DanielDamb28",email = "danieldamb80@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "flask-bcrypt (>=1.0.1,<2.0.0)",
    "flask-marshmallow (>=1.5.0,<2.0.0)",
    "flask-jwt-extended (>=4.7.4,<5.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)"
]

[tool.poetry]
packages = [{include = "flask_base", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
